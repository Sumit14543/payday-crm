name: Production Release Control

# The live app is deployed privately with staged health checks. Do not copy an
# older public main-branch build over it. Source publication is a separate step.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect release or restore previous app (keeps current customer data)
        required: true
        type: choice
        options: [status, rollback]
        default: status
permissions:
  contents: read
concurrency:
  group: production-private-release-control
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect or roll back the privately managed release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 4m
          script: |
            set -eu
            case '${{ inputs.action }}' in
              status|rollback) ;;
              *) exit 2 ;;
            esac
            /opt/alt/alt-nodejs24/root/usr/bin/node /home/waqtmoney/payday-releases/manageRelease.js '${{ inputs.action }}'
