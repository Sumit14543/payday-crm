name: Prepare Verified Security Runtime
on:
  push:
    branches: [main]
    paths:
      - backend/scripts/installSecurityRuntime.js
      - .github/workflows/security-runtime.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-security-runtime
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated scripts
        run: |
          mkdir -p security-runtime
          cp backend/scripts/installSecurityRuntime.js backend/scripts/securityPreflight.js security-runtime/
      - name: Copy outside the application directory
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT }}
          SOURCE: security-runtime/
          TARGET: /home/waqtmoney/security-runtime/
          ARGS: '-rlDztvc'
      - name: Install private signing key and pinned relay trust; verify without sending email
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            set -e
            if [ -f /home/waqtmoney/nodevenv/public_html/payday-api/24/bin/activate ]; then
              . /home/waqtmoney/nodevenv/public_html/payday-api/24/bin/activate
            fi
            cd /home/waqtmoney/public_html/payday-api
            CRM_ROOT=/home/waqtmoney/public_html/payday-api NODE_ENV=production PORT=8081 node /home/waqtmoney/security-runtime/installSecurityRuntime.js --apply
            CRM_ROOT=/home/waqtmoney/public_html/payday-api NODE_ENV=production PORT=8081 SECURITY_RUNTIME_REQUIRED=true node /home/waqtmoney/security-runtime/securityPreflight.js
