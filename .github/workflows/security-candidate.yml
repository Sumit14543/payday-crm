name: Verify Pull Request Flows
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact dependencies
        run: |
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Verify security and existing financial flows
        run: node tests/run-security.cjs
      - name: Audit locked dependencies
        run: |
          npm audit --prefix backend --include=dev --audit-level=low
          npm audit --prefix frontend --include=dev --audit-level=low
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://payday-api.waqtmoney.com/api
          VITE_DOCUMENT_BASE_URL: https://payday-api.waqtmoney.com/uploads
          VITE_FORCE_DIRECT_API: 'true'
        run: npm run build
      - name: Verify sanction confirmation in a local browser fixture
        run: node tests/sanction-decision-browser.cjs
